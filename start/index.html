<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="T3クローズ">
<meta name="theme-color" content="#1c1f26">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../img/hub-icon-180.png?v=37caae70">
<link rel="icon" type="image/png" sizes="64x64" href="../img/hub-icon-64.png?v=da13c9d5">
<title>T3クローズ｜T3Dining株式会社</title>
<link rel="stylesheet" href="../css/style.css?v=3bb5e923">
<style>
/* ============================================================
 *  切り替え画面（ホーム画面のフォルダ代わり）
 *  ここから現場アプリ・管理アプリのどちらかを開きます。
 * ============================================================ */
body { padding-bottom: 24px; }

.hub { max-width: 520px; margin: 0 auto; padding: 26px 16px 0; }
.hub__head { text-align: center; margin-bottom: 22px; }
.hub__logo {
  width: 74px; height: 74px; margin: 0 auto 12px;
  display: flex; align-items: center; justify-content: center;
  background: #fff; border: 1px solid var(--line); border-radius: 18px;
  overflow: hidden;
}
.hub__logo img { width: 100%; height: 100%; object-fit: contain; }
.hub__title { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: .01em; }
.hub__company { margin: 4px 0 0; font-size: 12.5px; color: var(--text-sub); }

.hub__list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.hub-card {
  display: flex; align-items: center; gap: 13px; width: 100%;
  padding: 18px 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 5px solid var(--card-color);
  border-radius: 14px; box-shadow: var(--shadow);
  font: inherit; color: var(--text); text-align: left;
  cursor: pointer; text-decoration: none;
}
.hub-card:active { background: var(--surface-2); }
.hub-card__icon {
  flex: 0 0 auto; width: 54px; height: 54px;
  background: #fff; border: 1px solid var(--line); border-radius: 13px;
  overflow: hidden;
}
.hub-card__icon img { width: 100%; height: 100%; object-fit: contain; display: block; }
.hub-card__text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.hub-card__name { font-size: 18px; font-weight: 700; line-height: 1.2; }
.hub-card__sub { font-size: 12.5px; color: var(--text-sub); line-height: 1.35; }
.hub-card__arrow { flex: 0 0 auto; font-size: 24px; color: var(--text-weak); line-height: 1; }

.hub__note {
  margin: 20px 2px 0; font-size: 12px; color: var(--text-sub); line-height: 1.7;
}
</style>
<meta name="app-version" content="70bf6fcb">
</head>
<body class="no-daytabs">

<main class="hub">
  <div class="hub__head">
    <div class="hub__logo"><img src="../img/t3dining-mark.png?v=c9163364" alt=""></div>
    <h1 class="hub__title">T3クローズ</h1>
    <p class="hub__company">T3Dining株式会社</p>
  </div>

  <ul class="hub__list">
    <li>
      <a class="hub-card" href="../owner/" style="--card-color:#c0392b">
        <span class="hub-card__icon"><img src="../img/app-icon-180.png?v=041e5fbb" alt=""></span>
        <span class="hub-card__text">
          <span class="hub-card__name">現場アプリ</span>
          <span class="hub-card__sub">毎日の確認・週間掃除をチェックする</span>
        </span>
        <span class="hub-card__arrow" aria-hidden="true">›</span>
      </a>
    </li>
    <li>
      <a class="hub-card" href="../kanri/" style="--card-color:#1b4f86">
        <span class="hub-card__icon"><img src="../img/admin-icon-180.png?v=9351d6f8" alt=""></span>
        <span class="hub-card__text">
          <span class="hub-card__name">管理アプリ</span>
          <span class="hub-card__sub">項目・担当者・定休日を設定する（管理用PINが必要）</span>
        </span>
        <span class="hub-card__arrow" aria-hidden="true">›</span>
      </a>
    </li>
  </ul>

  <p class="hub__note">
    ホーム画面にはこの画面だけを追加してください。1つのアイコンで両方のアプリが開けます。<br>
    この選択画面に戻るときは、アプリをいったん終了してから開き直してください。<br>
    ここから開く現場アプリは<b>管理者用</b>です。現場スタッフには別のURLを渡してください。
  </p>
</main>

</body>
</html>
