<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
{{共通CSS}}

/* 04_帯 ── 写真の上に白い帯を渡して、商品名をのせる

   ★帯は傾けない。マインのページ（story/）は、この見た目をSVGに包んで
     画像にしていて、その変換では transform: rotate() が落ちてしまう。
     Macの道具で作る画像と食い違わないよう、両方とも水平にそろえている */

.覆い {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.55) 100%);
}

.帯 {
  position: absolute;
  left: 0;
  width: 100%;
  top: 980px;
  background: #fffaf3;
  color: #1d1712;
  padding: 44px 60px 52px;
  box-shadow: 0 24px 70px rgba(0,0,0,0.4);
  text-align: center;
}

/* 帯は1行で見せたいので、長い名前は幅に収まるところまで自動で小さくする */
.帯 .名前 {
  color: #1d1712;
  white-space: nowrap;
  font-size: min(104px, calc(980px / var(--文字数)));
}

.コピー {
  position: absolute;
  left: var(--余白);
  right: var(--余白);
  top: 800px;
  text-align: center;
  color: #fff;
  text-shadow: 0 6px 30px rgba(0,0,0,0.7);
}

.値札 {
  position: absolute;
  right: 84px;
  top: 1320px;
}

.価格 {
  background: var(--差し色);
  color: #fff;
  padding: 22px 44px 26px;
  border-radius: 24px;
  box-shadow: 0 16px 50px rgba(0,0,0,0.45);
}

.店舗 {
  position: absolute;
  left: 0; right: 0;
  bottom: calc(var(--安全下) + 30px);
  text-align: center;
  text-shadow: 0 4px 24px rgba(0,0,0,0.6);
}
</style>
</head>
<body>
<div class="stage">
  <img class="写真" src="{{写真URL}}" alt="">
  <div class="覆い"></div>
  <div class="コピー">{{キャッチコピー}}</div>
  <div class="帯"><h1 class="名前 {{名前サイズ}}">{{商品名}}</h1></div>
  <div class="値札">{{価格ブロック}}</div>
  <div class="店舗">{{店舗名}}</div>
  {{イベント札}}
  {{ガイド}}
</div>
</body>
</html>
