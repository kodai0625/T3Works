<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
{{共通CSS}}

/* 12_肉の日 ── これまでの「本日は！！！ 肉の日」の投稿と同じ形。
   写真いっぱいに大きく「肉の日」、下に告知の帯とロゴ。

   ★ transform は使わない（マインのページの画像変換で落ちるため） */

.覆い {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg,
    rgba(0,0,0,0.50) 0%, rgba(0,0,0,0.12) 34%,
    rgba(0,0,0,0.12) 58%, rgba(0,0,0,0.80) 100%);
}

.見出し {
  position: absolute;
  left: 60px; right: 60px;
  top: calc(var(--安全上) + 10px);
  text-align: center;
  color: #f4efe2;
}

.見出し .前ふり {
  font-size: 66px;
  font-weight: 800;
  letter-spacing: 0.22em;
  text-shadow: 0 6px 30px rgba(0,0,0,0.55);
}

.見出し .おおきく {
  margin-top: 6px;
  font-size: 250px;
  font-weight: 800;
  line-height: 1.06;
  letter-spacing: 0.04em;
  text-shadow: 0 10px 44px rgba(0,0,0,0.55);
}

/* 手書きの下線のかわりの帯 */
.見出し .下線 {
  width: 78%;
  height: 14px;
  margin: 10px auto 0;
  border-radius: 999px;
  background: #f4efe2;
  box-shadow: 0 8px 26px rgba(0,0,0,0.45);
}

.告知 {
  position: absolute;
  left: 0; right: 0;
  bottom: calc(var(--安全下) - 40px);
  padding: 30px 60px 34px 70px;
  background: rgba(20,16,13,0.78);
  color: #fff;
  display: flex;
  align-items: center;
  gap: 24px;
}

.告知 .文 { flex: 1 1 auto; }

.告知 .きまり {
  font-size: 44px;
  font-weight: 700;
  letter-spacing: 0.08em;
  padding-bottom: 14px;
  border-bottom: 3px solid rgba(255,255,255,0.5);
}

.告知 .説明 p {
  font-size: 46px;
  font-weight: 800;
  line-height: 1.4;
  margin-top: 12px;
}

.告知 .ロゴ {
  width: 170px;
  height: 170px;
  flex: 0 0 auto;
  background: rgba(255,255,255,0.92);
  border-radius: 50%;
  padding: 10px;
}
</style>
</head>
<body>
<div class="stage">
  <img class="写真" src="{{写真URL}}" alt="">
  <div class="覆い"></div>

  <div class="見出し">
    <div class="前ふり">本日は！！！</div>
    <div class="おおきく">{{イベント見出し}}</div>
    <div class="下線"></div>
  </div>

  <div class="告知">
    <div class="文">
      <div class="きまり">毎月29日は{{イベント見出し}}</div>
      {{イベント説明}}
    </div>
    <img class="ロゴ" src="{{ロゴURL}}" alt="">
  </div>
  {{ガイド}}
</div>
</body>
</html>
