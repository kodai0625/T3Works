<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
{{共通CSS}}

/* 02_カード ── 同じ写真をぼかして背景にし、真ん中に白いカードを置く */

.背景 {
  position: absolute;
  inset: -80px;
  width: calc(100% + 160px);
  height: calc(100% + 160px);
  object-fit: cover;
  filter: blur(48px) saturate(1.25) brightness(0.62);
  transform: scale(1.1);
}

/* 高さを決め打ちにして、名前が2行になっても安全な範囲からはみ出さないようにする。
   はみ出す分は写真の高さが縮んで吸収する */
.カード {
  position: absolute;
  left: 90px;
  right: 90px;
  top: 50%;
  transform: translateY(-50%);
  height: 1180px;
  background: #fffaf3;
  color: #1d1712;
  border-radius: 56px;
  padding: 56px 56px 64px;
  box-shadow: 0 40px 120px rgba(0,0,0,0.45);
  display: flex;
  flex-direction: column;
  gap: 40px;
}

.カード .写真枠 {
  position: relative;
  width: 100%;
  flex: 1 1 auto;
  min-height: 0;
  border-radius: 36px;
  overflow: hidden;
}

.カード .写真 { position: absolute; }

.本文 { display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center; }

.コピー { color: #9a5b2e; }

.名前 { color: #1d1712; }
.名前.大 { font-size: 96px; }
.名前.中 { font-size: 78px; }
.名前.小 { font-size: 62px; }

.価格 { color: var(--差し色); }

.店舗 {
  position: absolute;
  top: var(--安全上);
  left: 0; right: 0;
  text-align: center;
  color: #fff;
  text-shadow: 0 4px 24px rgba(0,0,0,0.6);
}
</style>
</head>
<body>
<div class="stage">
  <img class="背景" src="{{写真URL}}" alt="">
  <div class="店舗">{{店舗名}}</div>
  <div class="カード">
    <div class="写真枠"><img class="写真" src="{{写真URL}}" alt=""></div>
    <div class="本文">
      <div class="コピー">{{キャッチコピー}}</div>
      <h1 class="名前 {{名前サイズ}}">{{商品名}}</h1>
      {{価格ブロック}}
    </div>
  </div>
  {{イベント札}}
  {{ガイド}}
</div>
</body>
</html>
