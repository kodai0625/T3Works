<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
{{共通CSS}}

/* 01_全面 ── 写真を全面に敷いて、下側に文字をまとめる */

.覆い {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg,
      rgba(0,0,0,0.55) 0%,
      rgba(0,0,0,0.10) 24%,
      rgba(0,0,0,0.00) 40%,
      rgba(0,0,0,0.55) 74%,
      rgba(0,0,0,0.88) 100%);
}

.本文 {
  position: absolute;
  left: var(--余白);
  right: var(--余白);
  bottom: var(--安全下);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 30px;
}

.コピー { color: var(--うすい文字); }

.名前 { text-shadow: 0 8px 40px rgba(0,0,0,0.55); }

.価格 {
  background: var(--差し色);
  padding: 16px 40px 20px;
  border-radius: 999px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.35);
}

.店舗 {
  position: absolute;
  top: var(--安全上);
  left: var(--余白);
  padding: 14px 30px;
  border: 3px solid rgba(255,255,255,0.85);
  border-radius: 999px;
  backdrop-filter: blur(8px);
}
</style>
</head>
<body>
<div class="stage">
  <img class="写真" src="{{写真URL}}" alt="">
  <div class="覆い"></div>
  <div class="店舗">{{店舗名}}</div>
  <div class="本文">
    <div class="コピー">{{キャッチコピー}}</div>
    <h1 class="名前 {{名前サイズ}}">{{商品名}}</h1>
    {{価格ブロック}}
  </div>
  {{イベント札}}
  {{ガイド}}
</div>
</body>
</html>
