<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
{{共通CSS}}

/* 10_バグる ── これまでのバグるのストーリーズと同じ形。
   上が写真、下がラベンダー色の下地。商品名・説明・営業時間・ロゴをのせる。

   ★ transform は使わない（マインのページの画像変換で落ちるため） */

.写真枠 {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 800px;
  overflow: hidden;
}

.下地 {
  position: absolute;
  top: 800px; left: 0; right: 0; bottom: 0;
  background: var(--ブランド下地);
}

.本文 {
  position: absolute;
  left: 70px;
  right: 70px;
  top: 830px;
  bottom: var(--安全下);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 14px;
  text-align: center;
  color: var(--ブランド文字);
}

.名前 { line-height: 1.15; }
.名前.大 { font-size: 92px; }
.名前.中 { font-size: 76px; }
.名前.小 { font-size: 60px; }

.価格 {
  font-size: 50px;
  color: var(--ブランド文字);
}
.価格 .税 { color: var(--ブランドうすい); }

/* サイズ違いがあるときは、値段は表で出す（そのときは大きい価格は出ない） */
.価格表 { color: var(--ブランド文字); gap: 2px; }
.価格表 .品 .名 { font-size: 32px; }
.価格表 .品 .額 { font-size: 40px; }
.価格表 .税書き { color: var(--ブランドうすい); }

/* 説明は写真の下の帯に収める。行がふえても入るよう小さめ */
.説明 p { color: var(--ブランド文字); font-size: 34px; line-height: 1.65; }

/* 右下のロゴとぶつからないよう、右側をあけておく */
.営業時間 {
  margin-top: 6px;
  padding-right: 230px;
  color: var(--ブランド文字);
}
.営業時間 .時間 { font-size: 29px; line-height: 1.45; }
.営業時間 .見出し { font-size: 27px; }
.営業時間 .定休日 { font-size: 26px; margin-top: 2px; }
.営業時間 .定休日 { color: var(--ブランドうすい); }

.ロゴ {
  position: absolute;
  right: 56px;
  bottom: calc(var(--安全下) + 10px);
  width: 200px;
  height: 200px;
}

/* キャッチコピーは写真の上に白抜きでのせる */
.コピー {
  position: absolute;
  left: 70px;
  right: 70px;
  top: calc(var(--安全上) + 10px);
  color: #fff;
  text-align: center;
  text-shadow: 0 6px 30px rgba(0,0,0,0.65);
}
</style>
</head>
<body>
<div class="stage">
  <div class="下地"></div>
  <div class="写真枠"><img class="写真" src="{{写真URL}}" alt=""></div>
  <div class="コピー">{{キャッチコピー}}</div>
  <div class="本文">
    <h1 class="名前 {{名前サイズ}}">{{商品名}}</h1>
    {{価格表ブロック}}
    {{価格ブロック}}
    {{説明ブロック}}
    {{営業時間ブロック}}
  </div>
  <img class="ロゴ" src="{{ロゴURL}}" alt="">
  {{イベント札}}
  {{ガイド}}
</div>
</body>
</html>
