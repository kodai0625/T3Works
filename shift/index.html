<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>シフト提出</title>
<link rel="stylesheet" href="css/submit.css?v=cd6b16c0">
<meta name="app-version" content="b16f3409">
</head>
<body>

<header class="head">
  <div class="head__inner">
    <span class="head__title" id="headTitle">シフト提出</span>
    <button type="button" class="head__me is-hidden" id="headMe"></button>
  </div>
</header>

<main class="page">

  <!-- ===== 1. 自分の番号 =====
       番号で誰なのかが決まります。名前をえらばせないので、
       ほかの人の名前で出すことはできません -->
  <section class="card" id="gate">
    <h1 class="card__title">あなたの番号を入れてください</h1>
    <p class="card__note">
      お店からLINEで送られた、<b>あなただけの番号</b>です。<br>
      1回入れれば、次からは出ません。
    </p>
    <!-- ★英字が入ることもあるので type="text"。iPhoneが勝手に大文字にしたり
         直したりしないよう、autocapitalize / autocorrect / spellcheck を切っています -->
    <input type="text" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false"
           class="input input--big" id="gatePin" placeholder="番号">
    <p class="err is-hidden" id="gateErr"></p>
    <button type="button" class="btn btn--primary btn--wide" id="gateGo">すすむ</button>
  </section>

  <!-- ===== 2. 希望を入れる ===== -->
  <section class="is-hidden" id="form">

    <div class="card card--period">
      <div class="period">
        <button type="button" class="period__btn" id="periodPrev" aria-label="前">‹</button>
        <div class="period__label">
          <span class="period__main" id="periodMain">9/1〜9/15</span>
          <span class="period__sub" id="periodSub"></span>
        </div>
        <button type="button" class="period__btn" id="periodNext" aria-label="次">›</button>
      </div>
      <p class="period__state" id="periodState"></p>
    </div>

    <p class="hint" id="slotHint"></p>

    <div class="days" id="days"></div>

    <div class="card">
      <label class="field">
        <span class="field__label">連絡（あれば）</span>
        <textarea class="input" id="note" rows="3"
                  placeholder="テスト期間で夜だけです／○日は少し遅れます など"></textarea>
      </label>
    </div>

    <p class="err is-hidden" id="sendErr"></p>
    <p class="ok is-hidden" id="sendOk"></p>

    <div class="foot">
      <button type="button" class="btn btn--primary btn--wide" id="send">この内容で出す</button>
      <p class="foot__note" id="footNote">締切までは、何度でも出し直せます。</p>
      <button type="button" class="btn btn--plain" id="signOut">番号を入れ直す</button>
    </div>
  </section>

</main>

<script src="../js/config.js?v=b6e773e1"></script>
<script src="js/submit.js?v=b7f6a39e"></script>
</body>
</html>
