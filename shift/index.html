<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>バグる シフト提出</title>

<!-- ホーム画面に追加したときの名前とアイコン。
     ★iPhoneが「追加」の画面に先に入れてくれる名前は
       apple-mobile-web-app-title です。ここを「バグる シフト提出」に
       しておくと、打ち直さなくてもその名前で追加できます。
       （アイコンの下は幅が狭いので、実際には途中までしか出ません） -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="バグる シフト提出">
<meta name="theme-color" content="#bf5480">
<link rel="apple-touch-icon" href="../img/shift-icon-180.png?v=68ba81bc">
<link rel="icon" href="../img/shift-icon-64.png?v=0937bb3b">

<link rel="stylesheet" href="css/submit.css?v=1db47e58">
<meta name="app-version" content="d6dd5e59">
</head>
<body>

<header class="head">
  <div class="head__inner">
    <span class="head__title" id="headTitle">シフト提出</span>
  </div>
</header>

<main class="page">

  <!-- ===== 0. 読み込み中 =====
       ★はじめはこれを出します。番号を覚えている人にまで
         「番号を入れてください」が一瞬見えてしまうのを防ぐためです -->
  <section class="boot" id="boot">
    <span class="boot__spin" id="bootSpin" aria-hidden="true"></span>
    <p class="boot__text" id="bootText">読み込んでいます…</p>
    <button type="button" class="btn is-hidden" id="bootRetry">もう一度ためす</button>
  </section>

  <!-- ===== 1. 自分の番号 =====
       番号で誰なのかが決まります。名前をえらばせないので、
       ほかの人の名前で出すことはできません -->
  <section class="card is-hidden" id="gate">
    <h1 class="card__title">あなたの番号を入れてください</h1>
    <p class="card__note">
      お店からLINEで送られた、<b>あなただけの番号</b>です。<br>
      1回入れれば、次からは出ません。
    </p>
    <!-- ★英字が入ることもあるので type="text"。iPhoneが勝手に大文字にしたり
         直したりしないよう、autocapitalize / autocorrect / spellcheck を切っています -->
    <input type="text" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false"
           class="input input--big" id="gatePin" placeholder="番号">
    <p class="err is-hidden" id="gateErr"></p>
    <button type="button" class="btn btn--primary btn--wide" id="gateGo">すすむ</button>
  </section>

  <!-- ===== 2. 希望を入れる ===== -->
  <section class="is-hidden" id="form">

    <!-- 誰のページか。開いた人が自分のものだと分かるように、大きく出します -->
    <div class="me" id="meCard">
      <span class="me__name" id="meName"></span>
      <span class="me__of">さんの シフト提出</span>
    </div>

    <div class="card card--period">
      <div class="period">
        <span class="period__main" id="periodMain"></span>
        <span class="period__sub" id="periodSub"></span>
      </div>
      <p class="period__due is-hidden" id="periodDue"></p>
      <p class="period__state" id="periodState"></p>
    </div>

    <!-- 募集していないときは、ここだけ出します -->
    <div class="card is-hidden" id="closedBox">
      <h2 class="card__title">いまは募集していません</h2>
      <p class="card__note" id="closedNote">
        次のシフトの募集がはじまると、ここに出ます。しばらくお待ちください。
      </p>
    </div>

    <!-- 確定したシフト。お店が「シフトを確定する」を押すと出ます -->
    <div class="card card--done is-hidden" id="builtBox">
      <h2 class="card__title" id="builtTitle">シフトが決まりました</h2>
      <p class="card__note">あなたの名前は<b>太字</b>で出ています。</p>
      <div class="built" id="builtList"></div>
      <button type="button" class="btn btn--wide" id="builtSave">画像で保存する</button>
      <p class="card__note" id="builtSaveNote">
        お店が印刷しているのと同じシフト表を、写真やファイルに残せます。
        LINEに送ることもできます。
      </p>
    </div>

    <!-- 出したあとの控え -->
    <div class="card card--done is-hidden" id="doneBox">
      <h2 class="card__title" id="doneTitle">出しました</h2>
      <p class="card__note">この内容で受け取りました。直したいときは、下から出し直せます。</p>
      <ul class="done-list" id="doneList"></ul>
    </div>

    <div id="entry">
      <p class="hint" id="slotHint"></p>
      <div class="days" id="days"></div>

      <p class="err is-hidden" id="sendErr"></p>

      <div class="foot">
        <button type="button" class="btn btn--primary btn--wide" id="send">提出する</button>
        <p class="foot__note">締切までは、何度でも出し直せます。</p>
      </div>
    </div>

    <button type="button" class="btn btn--plain" id="signOut">番号を入れ直す</button>
  </section>

</main>

<script src="../js/config.js?v=7755846d"></script>
<!-- シフト表を絵に描くところ。ワークスの「JPEGで保存」と同じものです -->
<script src="../js/shift-sheet.js?v=a35e5f7b"></script>
<script src="js/submit.js?v=6364ecdd"></script>
</body>
</html>
